<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>EmoBuff</title>
    <!--
      The GENERATED stylesheet, built from styles.css by the Tailwind CLI (`bun run build:css`,
      or the watcher in `bun run dev`). Tailwind v4's `@import "tailwindcss"` must be processed by
      Tailwind itself; the bundler just copies this file through.
    -->
    <link rel="stylesheet" href="./generated.css" />
    <!-- Paint the background before CSS arrives, so a reload never flashes white. -->
    <style>
      html {
        background-color: #141413;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- A LITERAL relative path: Bun finds the app by static analysis of this tag. -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
